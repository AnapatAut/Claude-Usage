# The stand-in for api.anthropic.com (sandbox/run.sh). Each request is one line of
# /var/log/stub.log: the protocol, method, path, the Authorization and anthropic-beta headers,
# a header a ~/.curlrc would add, the user agent, the status. What it answers is the included
# mode file, which run.sh swaps (then nginx -s reload).
log_format cu '$server_protocol|$request_method|$request_uri|$http_authorization|$http_anthropic_beta|$http_x_curlrc|$http_user_agent|$status';
server {
	listen 443 ssl http2;
	server_name api.anthropic.com;
	ssl_certificate /opt/sb/tls.crt;
	ssl_certificate_key /opt/sb/tls.key;
	access_log /var/log/stub.log cu;
	error_log /var/log/stub.err;
	include /etc/nginx/cu-mode.conf;
}
