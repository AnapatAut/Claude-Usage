# A 200 whose body comes at 1 byte/s: curl's --max-time ends the call after 5 s, and the fetch
# holds its state lock all that time (uninstall must wait for it).
location / {
	limit_rate 1;
	default_type application/json;
	return 200 '{"five_hour":null,"seven_day":null,"pad":"................................................................"}';
}
