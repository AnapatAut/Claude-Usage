# A 200 with the usage body, only for the sandbox's test token.
location = /api/oauth/usage {
	if ($http_authorization != "Bearer SECRET-TOKEN-SBX") {
		return 401 '{"error":{"type":"authentication_error"}}';
	}
	default_type application/json;
	return 200 '{"five_hour":{"utilization":30.4,"resets_at":"2030-01-01T00:00:00.000000+00:00"},"seven_day":{"utilization":12,"resets_at":"2030-01-05T00:00:00Z"},"seven_day_opus":null}';
}
location / {
	return 404;
}
