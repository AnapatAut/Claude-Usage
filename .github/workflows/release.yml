# A tag vX.Y.Z (the version in Cargo.toml) on a commit of main: every check of ci.yml, then the
# tarball built fresh here, its provenance attested, and a GitHub release with it. 0.x releases
# are pre-releases. Only the release job gets write permissions; the checks run without them.
# The steps by hand are in RELEASING.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: every check of ci.yml
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: build, attest, publish
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # gh release create
      id-token: write # the attestation's signing certificate (Sigstore, through OIDC)
      attestations: write # store the attestation in this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the tag is Cargo.toml's version, on main, and has a CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG, Cargo.toml $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::$TAG is not on main"; exit 1; }
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" ||
            { echo "::error::CHANGELOG.md has no section [$version]"; exit 1; }
      - run: scripts/cargo fetch
      - name: tarball
        id: tarball
        run: |
          path=$(scripts/tarball.sh "$RUNNER_TEMP/dist")
          [ -z "$(git status --porcelain)" ] || { echo "::error::the build changed the checkout"; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: attest the tarball's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.tarball.outputs.path }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: |
          pre=()
          case $TAG in v0.*) pre=(--prerelease) ;; esac
          gh release create "$TAG" "$TARBALL" --verify-tag "${pre[@]}" \
            --title "claude-usage $TAG" --notes-file "$RUNNER_TEMP/notes.md"
